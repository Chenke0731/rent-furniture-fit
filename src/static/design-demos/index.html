<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>租房青年家具适配 · 宜家仓储核验单 vs 小红书手账贴纸本 对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#F5F5F0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{
  position:sticky;top:0;z-index:20;background:#111;border-bottom:1px solid #333;
  padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.nav-title{font-weight:800;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  padding:7px 14px;background:#222;color:#CCC;border:1px solid #444;
  font-size:12px;font-weight:700;cursor:pointer;
}
.tab.active{background:#FFD000;color:#111;border-color:#FFD000}
.split{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 54px)}
iframe{width:100%;height:100%;border:none;display:block;background:#FFF}
.single{width:100%;height:calc(100vh - 54px);display:none}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">视觉对比台：左【候选3 宜家仓储核验单】 vs 右【候选5 小红书手账贴纸本 Product Notebook】</div>
  <div class="tabs">
    <button class="tab active" onclick="modeSplit(this)">双栏同屏对比（宜家仓储单 vs 小红书手账本）</button>
    <button class="tab" onclick="modeSingle('dir-4.html',this)">单看：小红书手账贴纸本 (Product Notebook)</button>
    <button class="tab" onclick="modeSingle('dir-3.html',this)">单看：宜家仓储核验单 (Spec Tag)</button>
    <button class="tab" onclick="modeSingle('dir-2.html',this)">单看：POPEYE 日式图解杂志</button>
    <button class="tab" onclick="modeSingle('dir-1.html',this)">单看：工程测距仪与空间沙盘</button>
  </div>
</div>
<div id="splitBox" class="split">
  <iframe src="dir-3.html" style="border-right:3px solid #111"></iframe>
  <iframe src="dir-4.html"></iframe>
</div>
<div id="singleBox" class="single">
  <iframe id="singleFrame" src="dir-4.html"></iframe>
</div>
<script>
function setAct(btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function modeSplit(btn){
  setAct(btn);
  document.getElementById('splitBox').style.display='grid';
  document.getElementById('singleBox').style.display='none';
}
function modeSingle(url,btn){
  setAct(btn);
  document.getElementById('splitBox').style.display='none';
  document.getElementById('singleBox').style.display='block';
  document.getElementById('singleFrame').src=url;
}
</script>
</body>
</html>
